<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ALUX Al monogram</title>
  <desc id="desc">A bold geometric A and a closely fitted slanted l form the Al monogram for ALUX. The l follows the angle of the A's right leg and retains a short right-facing foot. A warm orange gradient flows across the letters on a transparent square canvas.</desc>

  <defs>
    <linearGradient id="orange" x1="28" y1="60" x2="228" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff852b"/>
      <stop offset="1" stop-color="#ed541c"/>
    </linearGradient>
  </defs>

  <!-- Custom outlined letters keep the mark independent of installed fonts. -->
  <g fill="url(#orange)">
    <path fill-rule="evenodd" d="M28 196 80 60h30l52 136h-32l-11-30H70l-11 30Zm52-56h29L94.5 99Z"/>
    <path d="M119 60h29l41.294 108H228v28h-57Z"/>
  </g>
</svg>
